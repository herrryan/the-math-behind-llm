site_name: 大模型底层核心概念（零数学通识课）
site_description: 彻底剥离高深数学公式，用纯粹直觉、生活隐喻与实体模型讲透大语言模型全栈核心概念
site_author: Antigravity Education Team
site_url: https://github.com/herrryan/the-math-behind-llm

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - tables
  - attr_list
  - md_in_html
  - def_list

nav:
  - 课程首页: index.md
  - 概念大纲: curriculum.md
  - 模块 0 - 基石与认知起点:
      - 概念 00 - 下一个词接龙游戏: module-0/00-next-word-prediction.md
      - 概念 01 - 乐高文字积木: module-0/01-tokens-and-vocabulary.md
      - 概念 02 - 词语的思维经纬度: module-0/02-vectors-and-word-maps.md
      - 概念 03 - 谁和谁更亲近: module-0/03-similarity-and-direction.md
  - 模块 1 - 空间魔术与思维开关:
      - 概念 04 - 变换视角的魔法相机: module-1/04-spatial-transformations.md
      - 概念 05 - 纸张不能只折平线: module-1/05-activation-functions.md
      - 概念 06 - 双通道自适应水龙头: module-1/06-gating-mechanisms.md
  - 模块 2 - 灵魂引擎自注意力:
