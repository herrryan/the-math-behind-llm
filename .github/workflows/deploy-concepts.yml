name: Deploy All Curriculum Tracks to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build All MkDocs Tracks & Assemble Unified Pages Directory
        run: |
          mkdir -p _pages

          # 1. Copy root index.html and all chapter/lab HTML directories (00..33)
          cp index.html _pages/
          for dir in [0-9]*; do
            if [ -d "$dir" ]; then
              mkdir -p "_pages/$dir"
              cp "$dir"/*.html "_pages/$dir/" 2>/dev/null || true
            fi
          done

          # 2. Copy standalone HTML books if present
          if [ -d "pdf_build" ]; then
            mkdir -p _pages/pdf_build
            cp pdf_build/*.html _pages/pdf_build/ 2>/dev/null || true
          fi

          # 3. Build all 5 MkDocs tracks into their respective subpaths
          for track in concepts math engineering coding-guide reading-guide; do
            if [ -f "$track/mkdocs.yml" ]; then
              uv run --with mkdocs-material mkdocs build -f "$track/mkdocs.yml" -d "../_pages/$track"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
