name: Deploy Concepts to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'concepts/**'
      - '.github/workflows/deploy-concepts.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build MkDocs Concepts Site
        run: |
          uv run --with mkdocs-material mkdocs build -f concepts/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: concepts/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
