site_name: 大模型必读文献与淘汰技术全景指南
site_description: 厘清大模型技术演进谱系：哪些传世经典必须精读，哪些昔日明星方法已被彻底淘汰，哪些前沿范式正在重塑未来。
site_author: Antigravity Research Team
site_url: https://github.com/herrryan/the-math-behind-llm

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - def_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 全景导读与研读心法: index.md
  - 第一主线：架构创世纪 (Transformer与自回归): 01-track-architecture-foundations.md
  - 第二主线：现代架构四件套 (LLaMA范式): 02-track-modern-architecture-recipes.md
  - 第三主线：缩放定律与算力 (Scaling Laws): 03-track-scaling-laws-and-compute.md
  - 第四主线：后训练与对齐洗牌 (RLHF与DPO): 04-track-post-training-and-alignment.md
  - 第五主线：系统工程与显存加速 (FlashAttn与vLLM): 05-track-system-hardware-and-inference.md
  - 第六主线：思维链与前沿推理 (CoT与DeepSeek-R1): 06-track-reasoning-and-deepseek-frontier.md
  - 第七主线：淘汰与过时技术实录: 07-track-obsolete-methods-and-lessons.md
