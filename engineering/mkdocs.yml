site_name: The Engineering Behind Large Language Models
site_description: Deep systems and hardware foundations of LLMs — from silicon memory walls to FlashAttention and distributed scaling.
site_author: Antigravity Systems Team
site_url: https://github.com/herrryan/the-math-behind-llm

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - def_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Curriculum Overview: curriculum.md
  - Module 0 - Hardware Landscape:
      - Chapter E00 - Silicon Anatomy: module-0/00-silicon-anatomy.md
      - Chapter E01 - The Roofline Model: module-0/01-roofline-model.md
      - Chapter E02 - Memory Layouts & Coalescing: module-0/02-memory-layouts-and-coalescing.md
  - Module 1 - Attention in Silicon:
      - Chapter E03 - Naive Attention Memory Wall: module-1/03-naive-attention-memory-wall.md
      - Chapter E04 - FlashAttention (1, 2, 3): module-1/04-flash-attention.md
      - Chapter E05 - KV Cache & PagedAttention: module-1/05-kv-cache-and-paged-attention.md
      - Chapter E06 - MHA, GQA, and MLA: module-1/06-mha-mqa-gqa-mla.md
  - Module 2 - GEMM & Activations:
      - Chapter E07 - GEMM & Tensor Cores: module-2/07-gemm-tensor-cores.md
      - Chapter E08 - SwiGLU & FFNs in Silicon: module-2/08-swiglu-ffn-in-silicon.md
      - Chapter E09 - Fused RMSNorm & Residuals: module-2/09-fused-rmsnorm-residuals.md
      - Chapter E10 - RoPE Kernel Fusion: module-2/10-rope-kernel-fusion.md
  - Module 3 - Precision & Quantization:
